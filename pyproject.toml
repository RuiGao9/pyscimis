[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscimis"
version = "0.1.0"
description = "pyscimis: Automated time-series data extraction tool for spatial CIMIS dataset"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "rasterio>=1.3.0",
    "pyproj>=3.4.0",
    "matplotlib>=3.6.0",
    "xarray>=2022.09.0",
    "netCDF4>=1.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]